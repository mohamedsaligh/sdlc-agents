name: map-check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - name: Generated agents are current
        run: python scripts/sync-agents.py --check
      - name: Manifests validate
        run: python scripts/validate-manifests.py
      - name: No unreplaced placeholders outside init scripts
        run: |
          if grep -rIl --exclude-dir=.git --exclude-dir=runs --exclude='init-project.*' --exclude='map-check.yml' -e '__PLATFORM_NAME__' -e '__DEVCTL__' -e '__AI_PLATFORM__' -e '__CODE_ROOT__' -e '__DESIGN_DOCS_ROOT__' . ; then
            echo "::warning::placeholders still present (expected before scripts/init-project has run)"; fi
      # check-drift.py needs CODE_ROOT and DESIGN_DOCS_ROOT; run it on a self-hosted runner that mounts them:
      # - run: python scripts/check-drift.py
