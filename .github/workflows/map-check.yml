name: map-check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pyyaml
      - name: Generated agents are current
        run: python scripts/sync-agents.py --check
      - name: Manifests validate
        run: python scripts/validate-manifests.py --strict
      - name: No unreplaced placeholders (warning only until init-project has run)
        run: python scripts/init-project.py --verify || echo "::warning::placeholders still present (expected before scripts/init-project has run)"
      # check-drift.py needs CODE_ROOT and DESIGN_DOCS_ROOT; run it on a self-hosted runner that mounts them:
      # - run: python scripts/check-drift.py
